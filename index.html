<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cassie Lab 8-bits</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <main>

        <div class="block-box">

            <div class="block-2"></div>
            <div class="block-4"><h1 class="titulo">Cassie Lab 8-bits</h1></div>
            <div class="block-2"></div>
            
        </div>
        
        <div class="block-box">

            <div class="block-2">

                <div class="card">

                    <div class="card-header">

                        <div class="card-title">

                             <h2>Quick Sounds</h2>
                        </div>

                         <div class="card-subtitle">
                        
                        </div>
                       
                    </div>

                    <div class="card-body">
                        
                        <button id="coin" class="button-primary">Coin</button>
                        <button id="jump" class="button-primary">Jump</button>
                        <button id="laser" class="button-primary">Laser</button>

                    </div>

                </div>
            </div>


            <div class="block-4">

                <div class="card">

                    <div class="card-header">

                        <div class="card-title">
                                <h2>Sound Settings</h2>
                        </div>

                        <div class="card-subtitle">
                                    
                        </div>
                                
                    </div>

                    <div class="card-body">

                        <div class="input-group">

                            <div class="input-label">
                                <h3>Sound name</h3>
                            </div>
                            <input id="name" type="text" name="" class="input-field">
                        </div>

                        <div class="input-group">

                            <div class="input-label">

                                <h3>Wave</h3>
                                
                            </div>

                            <select id="wave" class="select-field">
                                <option>Square</option>
                                <option>triangle</option>
                                <option>sawtooth</option>
                            </select>
                            
                        </div>


                        <div class="input-group">

                            <div class="input-label">

                                <h3>frequency</h3>
                                
                            </div>


                            <input id="frequency" type="range" class="range-field" min="50" max="2000" step="1" value="440">
                                                        
                        </div>

                         <div class="input-group">

                            <div class="input-label">

                                <h3>Slide</h3>
                                
                            </div>

                            <input id="slide" type="range" class="range-field" min="-1000" max="1000" step="1" value="0">
                            
                        </div>

                         <div class="input-group">

                            <div class="input-label">

                                <h3>Time</h3>
                                
                            </div>

                            <input id="time" type="range" class="range-field" min="0.05" max="2.0" step="0.05" value="0.3">
                            
                        </div>

                        <div class="input-group">

                            <div class="input-label">

                                <h3>Volume</h3>
                                
                            </div>

                            <input id="volume" type="range" class="range-field" min="0" max="1" step="0.05" value="0.5">
                            
                        </div>

                         <div class="input-group">

                            <div class="input-label">

                                <h3>Vibration</h3>
                                
                            </div>

                            <input id="vibration" type="range" class="range-field" min="0" max="50" step="1" value="0">
                            
                        </div>


                        <div class="button-group">

                            <button id="play" class="button-alert">Play</button>
                            <button id="save" class="button-primary">Save</button>
                            <button  id="download" class="button-success">Download</button>
                            
                        </div>
                                
                    </div>
                            
                </div>
            
            </div>

            <div class="block-2">

                <div class="card">

                    <div class="card-header">

                        <div class="card-title">

                            <div class="input-group">

                                <div class="input-label">Search</div>
                                <input id="search" type="text" name="" class="input-field">
                                
                            </div>
                            
                        </div>

                        <div class="card-subtitle">
                            
                        </div>
                        
                    </div>

                    <div  id="sounds-list" class="card-body">

                        
                        
                    </div>
                    
                </div>
            
            </div>
            
        </div>

        <div class="block-box">

            <div class="block-2"></div>
            <div class="block-4"><h6 class="titulo">By Cassie Cass - november 17 2026</h6></div>
            <div class="block-2"></div>
            
        </div>

    </main>


    <script type="module" src="main.js"></script>

</body>
</html>
